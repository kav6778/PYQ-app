kind = "web"
previewPath = "/"
title = "PYQ Question Browser"
version = "1.0.0"
id = "artifacts/pyq-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23192

[services.development]
run = "pnpm --filter @workspace/pyq-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pyq-app", "run", "build" ]
publicDir = "artifacts/pyq-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23192"
BASE_PATH = "/"
